<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- ws: needed for Vite HMR in dev; harmless in prod -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self' ws: wss:" />
  <link rel="icon" href="data:," />
  <title>Homestead</title>
  <style>
    :root { --panel: rgba(16, 20, 24, .72); --accent: #6fcf5f; }
    body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; color: #eef2f0; }
    .panel {
      position: fixed; z-index: 1; background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px 14px;
      font-size: 13px; user-select: none;
    }
    #hud { top: 14px; left: 14px; }
    #clockpane { top: 14px; right: 14px; text-align: right; }
    #hint { bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 12px; opacity: .85; white-space: nowrap; }
    #toast {
      position: fixed; z-index: 2; top: 22%; left: 50%; transform: translateX(-50%);
      background: var(--panel); backdrop-filter: blur(10px); border-radius: 12px;
      padding: 10px 18px; font-size: 15px; opacity: 0; transition: opacity .25s; pointer-events: none;
    }
    button {
      margin: 2px; padding: 5px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.15);
      background: rgba(255,255,255,.07); color: #eef2f0; font-size: 12px; cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.16); }
    button.active { background: var(--accent); border-color: var(--accent); color: #102410; font-weight: 600; }
    #clock { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
    #day-label { font-size: 12px; opacity: .8; }
    #harvest { color: var(--accent); font-weight: 600; }
    #npc-status { margin-top: 8px; opacity: .85; white-space: pre-line; line-height: 1.5; }
    .row { margin-top: 6px; }
    #title { font-weight: 700; font-size: 14px; margin-bottom: 6px; }
    #mood { font-size: 18px; }
    #energy-bar, #hunger-bar {
      width: 130px; height: 7px; border-radius: 99px; background: rgba(255,255,255,.12);
      margin: 4px 0 2px auto; overflow: hidden;
    }
    #energy-fill {
      height: 100%; width: 100%; border-radius: 99px; transition: width .3s;
      background: linear-gradient(90deg, #e4572e, #f3a712, var(--accent));
    }
    #hunger-fill {
      height: 100%; width: 100%; border-radius: 99px; transition: width .3s;
      background: linear-gradient(90deg, #db2b39, #f3a712, #c9d478);
    }
    .bar-label { font-size: 10px; opacity: .55; text-align: right; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="hud" class="panel">
    <div id="title">🏡 Claude's Homestead</div>
    <div>
      <button id="mode-play" class="active">Play</button>
      <button id="mode-orbit">Orbit</button>
      <button id="mode-sculpt">Sculpt</button>
      <button id="mode-build">Build</button>
    </div>
    <div class="row">
      <button id="save">Save</button>
      <button id="load">Load</button>
      <button id="mute">🔊</button>
    </div>
    <div id="sculpt-opts" class="row" hidden>
      <button id="brush-raise" class="active">Raise</button><button id="brush-lower">Lower</button>
    </div>
    <div id="build-opts" class="row" hidden>
      <button id="mod-wall" class="active">Wall</button><button id="mod-floor">Floor</button><button id="mod-roof">Roof</button>
    </div>
    <div id="npc-status"></div>
  </div>
  <div id="clockpane" class="panel">
    <div id="clock">08:00</div>
    <div id="day-label">Day 1 · <span id="mood">🙂</span></div>
    <div id="season-label" class="bar-label">Spring</div>
    <div id="energy-bar"><div id="energy-fill"></div></div>
    <div class="bar-label">Hunger</div>
    <div id="hunger-bar"><div id="hunger-fill"></div></div>
    <div style="margin-top:5px">Harvested: <span id="harvest">0</span> 🎃 · Fish: <span id="fish-count">0</span> 🎣 · <span id="farm-level" style="opacity:.7">Lv.1</span> 🌾</div>
  </div>
  <div id="e-hint" style="position:fixed;z-index:2;bottom:58px;left:50%;transform:translateX(-50%);font-size:13px;background:rgba(16,20,24,.7);backdrop-filter:blur(8px);border-radius:20px;padding:6px 16px;pointer-events:none;transition:opacity .2s;opacity:0;border:1px solid rgba(255,255,255,.1)"></div>
  <div id="hint" class="panel">WASD move · Shift run · drag look · E interact · drag to look</div>
  <div id="toast"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
